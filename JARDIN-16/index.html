<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Prompt Lunes 27 Oct</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="frame">
      <!-- fondo -->
      <div class="bg"></div>

      <!-- barra lateral izquierda -->
      <aside class="sidebar">
        <!-- menú hamburguesa -->
        <button class="menu-btn" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- texto vertical -->
        <div class="side-content">
          <span class="side-byline">
            BY MARCUSS BROWN &amp; ARISTIDE BENOIST
          </span>

          <span class="side-logo">CANALS</span>

          <span class="side-city">AMSTERDAM</span>

          <div class="side-x">
            <span class="x">X</span>
            <span class="x">X</span>
            <span class="x">X</span>
          </div>
        </div>

        <!-- copy inferior -->
        <p class="side-footer">
          DESIGNED IN AMSTERDAM — DEVELOPED IN SPAIN
        </p>
      </aside>

      <!-- título principal -->
      <h1 class="main-title">CANALS</h1>

      <!-- bloque de texto sobre la casa -->
      <section class="copy-block">
        <p>
          Canals is a four part visual glimpse<br />
          into the creation &amp; history of the iconic<br />
          17th-century canals of Amsterdam.
        </p>
      </section>

      <!-- botón circular inferior derecho -->
      <button class="scroll-btn" aria-label="Scroll down">
        <span class="wave">∿</span>
      </button>
    </div>
  </body>
</html>
