<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Prompt Lunes 3 Nov</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="frame">
      <!-- HEADER -->
      <header class="top-bar">
        <div class="brand">untold</div>

        <div class="top-center">
          <span>W</span>
          <span>A</span>
          <span>C</span>
        </div>

        <div class="top-right">
          <button class="lang hover-target">( EN ) ▾</button>
          <button class="menu-circle hover-target">
            <span></span>
            <span></span>
          </button>
        </div>
      </header>

      <!-- PEQUEÑO CÍRCULO ROJO ARRIBA -->
      <div class="small-dot">
        <span class="dot"></span>
      </div>

      <!-- TEXTO GIGANTE -->
      <div class="hero-words">
        <span class="line">we tell</span>
        <span class="line">untold</span>
        <span class="line">stories</span>
      </div>

      <!-- IMAGEN / VIDEO SUPERIOR (subway.gif) -->
      <div class="card card-top hover-target">
        <img src="imgs/subway.gif" alt="subway video" />
      </div>

      <!-- ILUSTRACIÓN DERECHA (xlogo.png) -->
      <div class="card card-illustration hover-target">
        <img src="imgs/xlogo.png" alt="orange illustration" />
      </div>

      <!-- COLLAGE INFERIOR IZQUIERDA -->
      <div class="collage">
        <div class="collage-card collage-1 hover-target">
          <img src="imgs/img11.jpeg" alt="photo 1" />
        </div>
        <div class="collage-card collage-2 hover-target">
          <img src="imgs/japan.jpg" alt="photo 2" />
        </div>
        <div class="collage-card collage-3 hover-target">
          <img src="imgs/tij.jpg" alt="photo 3" />
        </div>
      </div>

      <!-- TEXTO DERECHA -->
      <section class="side-copy">
        <p class="asterisk">(*)</p>
        <p class="copy">
          We are a communications ecosystem built<br />
          to rethink how communication happens. Six<br />
          agencies. One integrated team.
        </p>
      </section>

      <!-- BOTÓN PRINCIPAL -->
      <div class="cta-wrapper">
        <button class="cta-btn hover-target">
          <span class="cta-dot"></span>
          <span>Explore our ecosystem</span>
        </button>
      </div>

      <!-- SCROLL A LA DERECHA -->
      <div class="scroll-indicator">
        <span>SCROLL TO DISCOVER</span>
        <div class="scroll-circle hover-target">
          <span class="scroll-arrow">⌄</span>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
