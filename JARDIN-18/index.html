<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Prompt Jueves 30 Oct</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="frame">
      <!-- NAV TOP -->
      <header class="top-bar">
        <nav class="nav-left">
          <button>ABOUT</button>
          <button>SHOP</button>
          <button>LEARN</button>
        </nav>

        <div class="logo-pill">
          <span class="logo-icon"></span>
          <span class="logo-text">ethical life</span>
        </div>

        <div class="nav-right">
          <button class="icon-pill">👤</button>
          <button class="icon-pill">🛒</button>
        </div>
      </header>

      <!-- TEXTO GIGANTE DE FONDO -->
      <h1 class="hero-word">ethical life</h1>

      <!-- GOMITAS / ESTRELLAS (PARALLAX ITEMS) -->
      <div class="gummy gummy--1 parallax-item" data-depth="40"></div>
      <div class="gummy gummy--2 parallax-item" data-depth="60"></div>
      <div class="gummy gummy--3 parallax-item" data-depth="30"></div>
      <div class="gummy gummy--4 parallax-item" data-depth="70"></div>
      <div class="gummy gummy--5 parallax-item" data-depth="50"></div>
      <div class="gummy gummy--6 parallax-item" data-depth="90"></div>

      <!-- BOTELLA GEOMÉTRICA (TAMBIÉN PARALLAX) -->
      <div class="bottle-wrapper parallax-item" data-depth="80">
        <div class="bottle-glow"></div>

        <div class="bottle">
          <div class="bottle-cap"></div>
          <div class="bottle-body">
            <div class="label-top">MULTI<br />FOR ALL</div>
            <div class="label-mid"></div>
            <div class="label-bottom">
              SUPPORTING<br />PLANT-BASED NUTRITION
            </div>
          </div>
        </div>
      </div>

      <!-- TEXTO INFERIOR -->
      <p class="tagline">
        Pharmacist and Nutritionist<br />
        Formulated.
      </p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
