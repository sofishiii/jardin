<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Prompt Viernes 31 Oct</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="frame">
      <!-- HEADER -->
      <header class="top-bar">
        <div class="logo">
          <!-- aquí podrías poner tu PNG del logo -->
          klook
        </div>

        <div class="top-right">
          <button class="lang-btn hover-target">
            English ▼
          </button>
          <button class="send-btn hover-target" aria-label="Next step">
            ✈️
          </button>
        </div>
      </header>

      <!-- TÍTULO -->
      <h1 class="hero-title">
        First up, set your Out of Office<br />
        message.
      </h1>

      <!-- TARJETAS / PNGs -->
      <div class="cards-area">
        <!-- “PNG” izquierda -->
        <div class="bg-ticket bg-ticket--left hover-target"></div>

        <!-- “PNG” derecha -->
        <div class="bg-ticket bg-ticket--right hover-target"></div>

        <!-- Tarjetas tipo fotos -->
        <div class="cards-stack">
          <div class="side-card side-card--left hover-target"></div>
          <div class="side-card side-card--right hover-target"></div>

          <!-- Tarjeta principal -->
          <article class="main-card hover-target">
            <div class="main-card-photo">
              <!-- aquí podrías poner <img src="photo-main.png"> -->
            </div>

            <div class="main-card-overlay">
              <div class="mini-icon">⟳</div>
              <p class="overlay-text">
                Drag the cards horizontally to cycle<br />
                through your options.
              </p>
            </div>

            <div class="main-card-footer">
              Off-grid mode ON. If you need<br />
              me… don’t.
            </div>
          </article>
        </div>
      </div>

      <!-- BOTÓN “NEXT” -->
      <div class="bottom-cta">
        <button class="next-btn hover-target">
          <span>Next</span>
          <span class="next-arrow">➜</span>
        </button>
      </div>

      <!-- FOOTER LINKS -->
      <footer class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms &amp; Conditions</a>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
